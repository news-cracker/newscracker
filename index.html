<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스크래커 (NewsCracker) — 매일 보는 짧은 뉴스</title>
<meta name="description" content="AI가 핵심만 쏙 골라 정리해 주는 데일리 요약 뉴스. 뉴스크래커를 iOS·Android에서 다운로드하세요.">
<meta name="theme-color" content="#FFEFDA">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="뉴스크래커 (NewsCracker)">
<meta property="og:description" content="바쁜 현대인을 위한, 매일 보는 짧은 뉴스 — AI가 핵심만 쏙 골라 정리해 주는 데일리 요약 뉴스">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --cream:#FFEFDA;
    --cream-2:#FFF8EF;
    --orange:#FF8C36;
    --orange-deep:#F27611;
    --ink:#1A1512;
    --ink-soft:#6B5B4D;
    --line:#F0DCC4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    background-image:
      radial-gradient(120% 70% at 50% -10%, #FFE3BF 0%, rgba(255,227,191,0) 60%),
      radial-gradient(90% 50% at 50% 110%, #FFF8EF 0%, rgba(255,248,239,0) 70%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    padding:clamp(20px,5vw,40px) 22px calc(clamp(20px,5vw,40px) + env(safe-area-inset-bottom));
  }
  main{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .icon{
    width:clamp(76px,22vw,92px);
    height:clamp(76px,22vw,92px);
    border-radius:23%;
    display:block;
    box-shadow:0 10px 24px rgba(242,118,17,.20), 0 2px 6px rgba(26,21,18,.06);
    background:#FFEFDA;
  }
  .wordmark{
    margin:clamp(14px,4vw,18px) 0 0;
    font-size:clamp(22px,6.4vw,26px);
    line-height:1.2;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .wordmark .en{
    display:block;
    margin-top:5px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.22em;
    color:var(--orange-deep);
    text-transform:uppercase;
  }
  .tagline{
    margin:clamp(14px,4vw,18px) 0 0;
    font-size:clamp(15px,4.1vw,16.5px);
    font-weight:700;
    line-height:1.45;
    letter-spacing:-0.01em;
  }
  .sub{
    margin:7px 0 0;
    font-size:clamp(13px,3.5vw,14px);
    line-height:1.5;
    color:var(--ink-soft);
    word-break:keep-all;
  }
  .buttons{
    width:100%;
    margin:clamp(22px,6vw,30px) 0 0;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .btn{
    display:flex;
    align-items:center;
    gap:13px;
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    text-decoration:none;
    font-size:15px;
    line-height:1.25;
    transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease;
    will-change:transform;
  }
  .btn:active{transform:scale(.978)}
  .btn .ico{
    flex:0 0 auto;
    width:26px;
    height:26px;
    display:grid;
    place-items:center;
  }
  .btn .ico svg{width:22px;height:22px;display:block}
  .btn .txt{
    flex:1 1 auto;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .btn .txt b{font-size:15px;font-weight:700;letter-spacing:-0.01em}
  .btn .txt small{font-size:11.5px;font-weight:600;opacity:.62;letter-spacing:.01em}
  .btn .arrow{
    flex:0 0 auto;
    width:18px;height:18px;
    opacity:.32;
  }
  .btn .arrow svg{width:18px;height:18px;display:block}

  .btn-ios{
    background:var(--ink);
    color:#FFF6EA;
    box-shadow:0 8px 20px rgba(26,21,18,.20);
  }
  .btn-ios .ico svg{fill:#FFF6EA}
  .btn-android{
    background:#FFFFFF;
    color:var(--ink);
    border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(242,118,17,.10);
  }
  .btn-android .ico svg{fill:var(--orange-deep)}

  footer{
    margin:clamp(26px,7vw,34px) 0 0;
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:12px;
    color:var(--ink-soft);
  }
  footer a{
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid rgba(107,91,77,.28);
    padding-bottom:1px;
  }
  .copy{font-size:11px;opacity:.62}

  @media (prefers-reduced-motion:reduce){
    .btn{transition:none}
  }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-180.png" width="92" height="92" alt="뉴스크래커 앱 아이콘">
  <h1 class="wordmark">뉴스크래커<span class="en">NewsCracker</span></h1>
  <p class="tagline">바쁜 현대인을 위한, 매일 보는 짧은 뉴스</p>
  <p class="sub">AI가 핵심만 쏙 골라 정리해 주는 데일리 요약 뉴스</p>

  <nav class="buttons" aria-label="앱 다운로드">
    <a class="btn btn-ios" href="https://apps.apple.com/kr/app/%EB%89%B4%EC%8A%A4%ED%81%AC%EB%9E%98%EC%BB%A4-%EB%A7%A4%EC%9D%BC-%EB%B3%B4%EB%8A%94-%EC%9A%94%EC%95%BD-%EB%89%B4%EC%8A%A4-ai-%EB%B8%8C%EB%A6%AC%ED%95%91/id6746927652" rel="noopener">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      </span>
      <span class="txt"><b>App Store 다운로드</b><small>iPhone · iPad</small></span>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.newscracker.news_app" rel="noopener">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.1 2.3c-.3.3-.5.8-.5 1.4v16.6c0 .6.2 1.1.5 1.4l.1.1 9.3-9.3v-.2L4.1 2.3zM16.8 15.1l-3.1-3.1v-.2l3.1-3.1.1.1 3.7 2.1c1.1.6 1.1 1.6 0 2.2l-3.8 2zM16.8 15.1l-3.2-3.2-9.5 9.5c.4.4 1 .5 1.7.1l11-6.4M16.8 8.9L5.8 2.5c-.7-.4-1.3-.3-1.7.1l9.5 9.5 3.2-3.2z"/></svg>
      </span>
      <span class="txt"><b>Google Play 다운로드</b><small>Android</small></span>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
  </nav>

  <footer>
    <span>문의 <a href="mailto:news0cracker0@gmail.com">news0cracker0@gmail.com</a></span>
    <span class="copy">© NewsCracker · Team EagerBeavers</span>
  </footer>
</main>
</body>
</html>
